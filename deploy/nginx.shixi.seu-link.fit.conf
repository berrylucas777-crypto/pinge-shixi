# 只接管子域名，不影响 seu-link.fit 上的「可可的笔记」
# 放到服务器 /etc/nginx/conf.d/shixi.seu-link.fit.conf
# DNS 先加 A 记录：shixi.seu-link.fit -> 服务器 IP
# 然后签证书：certbot --nginx -d shixi.seu-link.fit

server {
    listen 80;
    listen [::]:80;
    server_name shixi.seu-link.fit;
    return 301 https://shixi.seu-link.fit$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shixi.seu-link.fit;

    ssl_certificate     /etc/letsencrypt/live/shixi.seu-link.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shixi.seu-link.fit/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
